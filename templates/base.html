<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if title %}{{ title }} · {% endif %}{{ site.full_name }}</title>
<meta name="description" content="{{ description or site.subline }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ site.fonts }}">
<link rel="stylesheet" href="/css/site.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/">{{ site.full_name }}</a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false">Menu</button>
    <nav class="site-nav">
      {% for item in site.nav %}
      <a href="{{ item.path }}"{% if page_path.startswith(item.path) %} class="is-active"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
<main>
{% block main %}{% endblock %}
</main>
<footer class="site-footer">
  <div class="wrap">
    <span>{{ site.full_name }}</span>
    <span>Last updated {{ last_updated }}</span>
  </div>
</footer>
<script src="/js/site.js"></script>
</body>
</html>
